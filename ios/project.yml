name: Golda

options:
  bundleIdPrefix: com.f4studio
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 98SBSKJT3M
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GoldaCore:
    path: Packages/GoldaCore
  GoldaData:
    path: Packages/GoldaData
  GoldaSync:
    path: Packages/GoldaSync

targets:
  Golda:
    type: application
    platform: iOS
    sources:
      - path: Golda
    dependencies:
      - package: GoldaCore
      - package: GoldaData
      - package: GoldaSync
      - target: GoldaWidgets
    # The keys the build settings cannot express. The voice's ways in from outside (`VoiceEntry`):
    # the widget's link opens the `golda` scheme, and the quick action on the icon is there from the
    # install on. The reminders' background refresh (`ReminderBackground`). A voice note recorded
    # without the app (`BackgroundVoiceNote`) shows a Live Activity, and keeps the microphone with the
    # app out of sight: the `audio` background mode, without which iOS suspends the app a few seconds
    # after the intent returns and the note is cut off. The file is generated; its versions stay the
    # build settings', which XcodeGen would otherwise write as 1.0 (1). Sync (stage 5): CloudKit's
    # silent pushes wake the sync engines (`remote-notification`), and `CKSharingSupported` lets the
    # app take an iCloud invitation (`SceneDelegate`).
    info:
      path: Golda/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.f4studio.golda
            CFBundleURLSchemes: [golda]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.f4studio.golda.voice
            UIApplicationShortcutItemTitle: Say a purchase
            UIApplicationShortcutItemIconSymbolName: mic.fill
        BGTaskSchedulerPermittedIdentifiers: [com.f4studio.golda.reminders]
        UIBackgroundModes: [fetch, audio, remote-notification]
        NSSupportsLiveActivities: true
        CKSharingSupported: true
    # The App Group where the app leaves «Можно сегодня» for the widgets (`TodaySnapshot`); the
    # iCloud container of sync and sharing (D4) and the pushes CloudKit sends its engines. Automatic
    # signing turns `aps-environment` to production for App Store builds. The file is generated,
    # like Info.plist.
    entitlements:
      path: Golda/Golda.entitlements
      properties:
        com.apple.security.application-groups: [group.com.f4studio.golda]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.f4studio.golda]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f4studio.golda
        PRODUCT_NAME: Golda
        # iPhone only (D2), set on the target: XcodeGen's application preset puts iPad back, and App
        # Store Connect then rejects the portrait-only bundle for iPad multitasking.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Golda
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # HTTPS only (Gemini, the CBR rates, CloudKit): exempt, so App Store Connect asks no export question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Golda listens while you hold a purchase in your voice, to turn it into a record. The sound is sent to Google Gemini with your own key only after you agree."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # «Можно сегодня», the voice widget and Control Center's control. The figures come from the app
  # through the App Group; formatted with GoldaCore's `Fmt`, as in the app.
  GoldaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GoldaWidgets
      # Shared with the app: the intents the mic, the control and the Live Activity run, the links
      # the widgets open, the snapshot the app writes, the Live Activity's state, the bar's geometry,
      # their labels.
      - path: Golda/App/StartVoiceNoteIntent.swift
      - path: Golda/App/VoiceActivity.swift
      - path: Golda/App/VoiceEntry.swift
      - path: Golda/App/AppLink.swift
      - path: Golda/App/TodaySnapshot.swift
      - path: Golda/UI/Components/WavyBarGeometry.swift
      - path: Golda/Resources/EntryPoints.xcstrings
      - path: Golda/Resources/Widgets.xcstrings
      - path: Golda/Resources/VoiceActivity.xcstrings
    dependencies:
      - package: GoldaCore
    entitlements:
      path: GoldaWidgets/GoldaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.f4studio.golda]
    info:
      path: GoldaWidgets/Info.plist
      properties:
        # An extension's versions must be its app's.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f4studio.golda.widgets
        PRODUCT_NAME: GoldaWidgets
        TARGETED_DEVICE_FAMILY: "1"
        # The shared intents compile here only to be named by buttons; their work is the app's.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GOLDA_WIDGETS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Golda

  GoldaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoldaTests
    dependencies:
      - target: Golda
      - package: GoldaCore
      - package: GoldaData
      - package: GoldaSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f4studio.golda.tests
        GENERATE_INFOPLIST_FILE: YES

  GoldaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoldaUITests
    dependencies:
      - target: Golda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f4studio.golda.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Golda:
    build:
      targets:
        Golda: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [GoldaTests, GoldaUITests]
    archive:
      config: Release
