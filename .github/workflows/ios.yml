name: iOS

on:
  push:
    branches: [main, ios-port]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      # The domain imports only Foundation, so its tests run on the Mac without a simulator.
      - name: Domain tests
        working-directory: ios/Packages/GoldaCore
        run: swift test

      - name: Other packages
        run: |
          swift build --package-path ios/Packages/GoldaData
          swift build --package-path ios/Packages/GoldaSync

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned: CI has no certificates, and the simulator does not need them.
      - name: Build the app
        working-directory: ios
        run: |
          xcodebuild build \
            -project Golda.xcodeproj -scheme Golda \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
