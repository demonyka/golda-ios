name: iOS

on:
  push:
    branches: [main, ios-port]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      # The domain imports only Foundation, so its tests run on the Mac without a simulator.
      - name: Domain tests
        working-directory: ios/Packages/GoldaCore
        run: swift test

      - name: Data tests
        working-directory: ios/Packages/GoldaData
        run: swift test

      # The stub transport and the CloudKit mapping need no iCloud: CKRecords are built locally.
      - name: Sync tests
        working-directory: ios/Packages/GoldaSync
        run: swift test

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned: CI has no certificates, and the simulator does not need them. Runs the hosted
      # unit tests and the UI scenarios. The hosted runner is several times slower than a Mac, and a
      # different UI scenario ran out of time on each run (a toast, a banner, a swipe), while each
      # passes on its own: a failed test gets two more tries before it fails the build.
      - name: Test the app
        working-directory: ios
        # xcodebuild hands TEST_RUNNER_ variables to the tests without the prefix.
        env:
          TEST_RUNNER_GOLDA_CI: '1'
        run: |
          xcodebuild test \
            -project Golda.xcodeproj -scheme Golda \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO
